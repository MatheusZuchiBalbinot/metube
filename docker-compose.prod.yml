services:
  # Dev Vite server off; the SPA is prebuilt by frontend-build below.
  frontend:
    profiles:
      - dev

  # One-shot SPA build → frontend_dist volume; caddy waits for it.
  frontend-build:
    build:
      context: ./frontend
      target: builder
      args:
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
    volumes:
      - frontend_dist:/dist
    command: sh -c "cp -r /app/dist/. /dist/"
    restart: "no"
    networks:
      - app_net

  # ports closed to the host; tuning sized for SSD + ~2–4 GB RAM.
  postgres:
    ports: []
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200

  redis:
    ports: []

  # "auto" → one Octane worker per core (resolved in entrypoint.sh).
  backend:
    environment:
      OCTANE_WORKERS: auto
    mem_limit: 1g

  caddy:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - frontend_dist:/var/www/frontend:ro
      - metube_storage:/var/www/storage-root:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    depends_on:
      backend:
        condition: service_started
      reverb:
        condition: service_started
      frontend-build:
        condition: service_completed_successfully

volumes:
  frontend_dist:
  caddy_data:
  caddy_config:
