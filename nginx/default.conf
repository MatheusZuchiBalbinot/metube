server {
    listen 80;
    server_name _;

    client_max_body_size 2G;

    # WSL2 + Docker named volumes: sendfile() returns EINVAL on the host kernel,
    # so nginx sends headers but no body → ERR_EMPTY_RESPONSE in the browser.
    sendfile off;

    location /storage/ {
        alias /var/www/storage-root/app/public/;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
    }

    location /app/ {
        resolver 127.0.0.11 valid=30s;
        set $reverb http://reverb:8080;
        proxy_pass $reverb;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Resumable uploads (tus) — each PATCH is at most one chunk (≤ 10 MB).
    # proxy_request_buffering off is critical: tus-php reads directly from the
    # input stream and must not wait for nginx to buffer the full body first.
    location /api/uploads/tus {
        client_max_body_size 10M;
        proxy_request_buffering off;
        proxy_pass http://backend:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://backend:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
    }
}
