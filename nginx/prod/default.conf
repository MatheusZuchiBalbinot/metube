# ---------------------------------------------------------------------------
# Rate limiting zone.
#
# NOTE: `limit_req_zone` is an *http-context* directive. This file is included
# from nginx.conf via `include /etc/nginx/conf.d/*.conf;`, which the stock
# nginx:alpine image places INSIDE the `http { }` block — so defining the zone
# here is valid. If a future nginx.conf moves the include into a `server`
# context, this zone must be relocated to the http context of nginx.conf.
#
# 10m of shared memory holds ~160k unique client IPs. 30 r/s sustained per IP
# with a burst allowance is generous for a SPA hitting /api while still
# blunting credential-stuffing / scraping floods.
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

upstream backend {
    server backend:8000;
    keepalive 8;
}

# ---------------------------------------------------------------------------
# TLS termination.
#
# This server only `listen 80;`. TLS is expected to terminate UPSTREAM at an
# external load balancer / reverse proxy (e.g. cloud LB, Cloudflare, Traefik),
# which forwards plaintext HTTP to this container over the private network and
# sets `X-Forwarded-Proto: https`. Do NOT add certs here.
#
# If you instead want nginx itself to terminate TLS, uncomment and adapt the
# template below and mount real certs (this image generates none):
#
# server {
#     listen 443 ssl http2;
#     server_name your.domain;
#     ssl_certificate     /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers HIGH:!aNULL:!MD5;
#     # ... then duplicate the location blocks from the :80 server below.
# }
#
# # Redirect plaintext to TLS when nginx terminates:
# server {
#     listen 80;
#     server_name your.domain;
#     return 301 https://$host$request_uri;
# }
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    client_max_body_size 2G;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # -----------------------------------------------------------------------
    # Security response headers (applied to all responses via `always`).
    # -----------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    # DENY: the SPA does not embed itself in frames. Switch to SAMEORIGIN only
    # if same-origin framing (e.g. a preview iframe) is ever introduced.
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS only has effect when the response is served over HTTPS (i.e. once TLS
    # terminates upstream/here). It is harmless over plain HTTP — browsers
    # ignore it on non-secure responses.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # TODO(CSP): a Content-Security-Policy is left disabled because the SPA
    # loads hashed Vite bundles, connects to the websocket origin (/app), and
    # streams HLS media; a wrong policy silently breaks playback/realtime.
    # Validate against a real build (esp. `connect-src` for ws:// + media,
    # `media-src`, and any inline styles) before enabling. Starting point:
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;

    root /var/www/frontend;

    # Vite hashed assets — immutable, cache forever
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /storage/ {
        alias /var/www/storage-root/app/public/;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
        # TODO(CORS): this currently allows ANY origin to read media via CORS.
        # Tighten to the real frontend origin once known, e.g.:
        #   add_header Access-Control-Allow-Origin "https://app.example.com";
        # It is left as `*` because the production frontend origin is not
        # safely determinable from this config (no env/variable is wired in
        # here, and hardcoding a wrong host would break media loading).
        add_header Access-Control-Allow-Origin *;
    }

    location /app/ {
        resolver 127.0.0.11 valid=30s;
        set $reverb http://reverb:8080;
        proxy_pass $reverb;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/uploads/tus {
        client_max_body_size 10M;
        proxy_request_buffering off;
        proxy_pass http://backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /api/ {
        # Rate limit the API. burst=60 absorbs short bursts (e.g. a page
        # loading several endpoints at once); nodelay serves the burst
        # immediately rather than queuing it. Excess is rejected with 503.
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /sanctum/ {
        proxy_pass http://backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA — serve index.html for all unmatched routes; no-cache so deploys propagate
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
