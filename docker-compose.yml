name: metube

services:
  postgres:
    image: postgres:16.4
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    networks:
      - app_net
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      OCTANE_WORKERS: 2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
      - backend_cache:/app/bootstrap/cache
      - metube_storage:/app/storage
    working_dir: /app
    networks:
      - app_net
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  whisper:
    # Gated by COMPOSE_PROFILES; omit it to use a hosted API via WHISPER_URL.
    profiles:
      - whisper
    build:
      context: ./whisper
      args:
        WHISPER_MODEL: medium
    restart: unless-stopped
    environment:
      - WHISPER_MODEL=medium
      - WHISPER_LANGUAGE=pt
      - STORAGE_ROOT=/storage/app/public
    volumes:
      - metube_storage:/storage:ro
    networks:
      - app_net
    # The whisper image is python:3.11-slim and ships no curl/wget, so we probe
    # the FastAPI /health endpoint with Python's stdlib urllib instead.
    # start_period covers uvicorn boot (the model is pre-baked at build time and
    # /health does not load it, so it responds quickly once the server is up).
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8001/health').status==200 else sys.exit(1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  horizon:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: php artisan horizon
    # No whisper dependency: it may be disabled; jobs retry until it responds.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
      - backend_cache:/app/bootstrap/cache
      - metube_storage:/app/storage
    working_dir: /app
    networks:
      - app_net
    mem_limit: 512m

  reverb:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: php artisan reverb:start --host=0.0.0.0 --port=8080 --no-interaction
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
      - backend_cache:/app/bootstrap/cache
      - metube_storage:/app/storage
    working_dir: /app
    networks:
      - app_net
    mem_limit: 128m

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
      - "${FRONTEND_PREVIEW_PORT:-4173}:4173"
    environment:
      NODE_OPTIONS: "--max-old-space-size=768"
      CHOKIDAR_USEPOLLING: "0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    working_dir: /app
    networks:
      - app_net
    stdin_open: true
    tty: true
    depends_on:
      - backend
    mem_limit: 1g

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - metube_storage:/var/www/storage-root:ro
    depends_on:
      - backend
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  app_net:
    driver: bridge

volumes:
  pgdata:
  metube_storage:
  backend_vendor:
  backend_cache:
  frontend_node_modules:
