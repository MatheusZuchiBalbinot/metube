name: vidsum

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env.postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - app_net
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      OCTANE_WORKERS: 2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
      - backend_cache:/app/bootstrap/cache
      - vidsum_storage:/app/storage
    working_dir: /app
    networks:
      - app_net
    mem_limit: 512m

  whisper:
    build:
      context: ./whisper
      args:
        WHISPER_MODEL: medium
    restart: unless-stopped
    environment:
      - WHISPER_MODEL=medium
      - WHISPER_LANGUAGE=pt
      - STORAGE_ROOT=/storage/app/public
    volumes:
      - vidsum_storage:/storage:ro
    networks:
      - app_net

  horizon:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: php artisan horizon
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      whisper:
        condition: service_started
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
      - backend_cache:/app/bootstrap/cache
      - vidsum_storage:/app/storage
    working_dir: /app
    networks:
      - app_net
    mem_limit: 512m

  reverb:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: php artisan reverb:start --host=0.0.0.0 --port=8080 --no-interaction
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
      - backend_cache:/app/bootstrap/cache
      - vidsum_storage:/app/storage
    working_dir: /app
    networks:
      - app_net
    mem_limit: 128m

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      NODE_OPTIONS: "--max-old-space-size=768"
      CHOKIDAR_USEPOLLING: "0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    working_dir: /app
    networks:
      - app_net
    stdin_open: true
    tty: true
    depends_on:
      - backend
    mem_limit: 1g

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - vidsum_storage:/var/www/storage-root:ro
    depends_on:
      - backend
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  pgdata:
  vidsum_storage:
  backend_vendor:
  backend_cache:
  frontend_node_modules:
