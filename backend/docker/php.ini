; Limits for the legacy single-POST upload route (POST /api/videos).
; Once that route is removed and all uploads go through tus (chunked),
; these can be dropped to 10M — tus chunks are capped at 10M by nginx.
upload_max_filesize = 2G
post_max_size = 2G
memory_limit = 512M
max_execution_time = 0
max_input_time = -1
