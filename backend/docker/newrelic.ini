; New Relic PHP agent — https://docs.newrelic.com/docs/apm/agents/php-agent/
;
; License key and app name are read from environment variables at runtime:
;   NEW_RELIC_LICENSE_KEY  →  newrelic.license
;   NEW_RELIC_APP_NAME     →  newrelic.appname
;   NEW_RELIC_ENABLED      →  newrelic.enabled
;
; Leave NEW_RELIC_LICENSE_KEY empty in local dev to disable the agent.
extension = newrelic.so

newrelic.appname = "MeTube"
newrelic.enabled = true

; Log to stderr so Docker captures output via `docker logs`
newrelic.logfile        = "/proc/self/fd/2"
newrelic.daemon.logfile = "/proc/self/fd/2"

; Distributed tracing for cross-service visibility (queue jobs, HTTP calls)
newrelic.distributed_tracing_enabled = true

; Slow query tracing — SQL values are obfuscated before leaving the server
newrelic.transaction_tracer.enabled    = true
newrelic.transaction_tracer.record_sql = "obfuscated"

; Error collection
newrelic.error_collector.enabled = true

; Browser monitoring is irrelevant for a JSON API
newrelic.browser_monitoring.auto_instrument = false
